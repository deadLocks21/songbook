  build-windows:
    name: Build Windows (${{ needs.prepare.outputs.version }})
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        env:
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          flutter build windows --release `
            --build-name="$env:VERSION" `
            --build-number="${{ github.run_number }}" `
            --dart-define=SIGNOZ_INGEST_URL="$env:SIGNOZ_INGEST_URL" `
            --dart-define=SIGNOZ_INGESTION_KEY="$env:SIGNOZ_INGESTION_KEY" `
            --dart-define=SIGNOZ_ENV="$env:SIGNOZ_ENV"

      - name: Zip Windows build output
        # Le .exe dépend des DLL Flutter et du dossier `data/` côte à côte
        # → on zippe tout le dossier Release pour un archive autonome.
        shell: pwsh
        run: |
          $zipName = "songbook-windows-$env:VERSION-${{ github.run_number }}.zip"
          $sourceDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $sourceDir)) {
            Write-Error "Build output directory not found: $sourceDir"
            exit 1
          }
          Compress-Archive -Path "$sourceDir/*" -DestinationPath $zipName
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: songbook-windows
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ needs.prepare.outputs.version }})
    needs: prepare
    # ubuntu-22.04 (glibc 2.35) plutôt que ubuntu-latest (24.04 / glibc 2.39)
    # pour rester compatible avec les distros utilisateur un peu plus anciennes.
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtk-3-dev \
            clang \
            cmake \
            pkg-config \
            liblzma-dev \
            libasound2-dev \
            libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop

      - run: flutter pub get

      - name: Build Linux release
        env:
          SIGNOZ_INGESTION_KEY: ${{ secrets.SIGNOZ_INGESTION_KEY }}
        run: |
          flutter build linux --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=SIGNOZ_INGEST_URL="$SIGNOZ_INGEST_URL" \
            --dart-define=SIGNOZ_INGESTION_KEY="$SIGNOZ_INGESTION_KEY" \
            --dart-define=SIGNOZ_ENV="$SIGNOZ_ENV"

      - name: Assemble AppDir
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          APPDIR="AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$BUNDLE_DIR"/* "$APPDIR/usr/bin/"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin/lib:${LD_LIBRARY_PATH}"
          cd "$HERE/usr/bin" && exec ./songbook "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/songbook.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Songbook
          Comment=Songbook
          Exec=songbook
          Icon=songbook
          Categories=Audio;Music;Utility;
          Terminal=false
          StartupWMClass=fr.dtfh.songbook
          EOF

          cp assets/icon/app_icon.png "$APPDIR/songbook.png"

      - name: Download appimagetool
        run: |
          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Build AppImage
        # `--appimage-extract-and-run` : appimagetool est lui-même un AppImage
        # qui requiert FUSE2 pour s'auto-monter. Sur GHA, FUSE n'est pas dispo.
        run: |
          APPIMAGE_NAME="Songbook-${VERSION}-${{ github.run_number }}-x86_64.AppImage"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "$APPIMAGE_NAME"
          echo "APPIMAGE_NAME=$APPIMAGE_NAME" >> "$GITHUB_ENV"

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: songbook-linux
          path: ${{ env.APPIMAGE_NAME }}
          retention-days: 14
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────
  # UPDATER — Binaire installateur/launcher/auto-updater (Windows + Linux).
  # Indépendant des builds d'app : c'est un petit CLI Dart (tool/updater)
  # attaché à la release pour que l'utilisateur le télécharge une seule fois.
  # Bootstrap : téléchargé UNE fois, ensuite il met à jour l'app ET lui-même.
  # ───────────────────────────────────────────────────────────────────────

  build-updater:
    name: Build Updater (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            out: songbook-updater-windows.exe
            artifact: songbook-updater-windows
          - os: ubuntu-22.04
            label: Linux
            out: songbook-updater-linux
            artifact: songbook-updater-linux

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve updater deps
        working-directory: tool/updater
        run: dart pub get

      # CLI console autonome (pas de Flutter) : `dart compile exe` produit un
      # binaire natif. Les lancements quotidiens passent par un wrapper caché
      # (VBS Windows / .desktop Linux) généré à l'installation.
      - name: Compile updater
        working-directory: tool/updater
        run: dart compile exe bin/songbook_updater.dart -o "${{ matrix.out }}"

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tool/updater/${{ matrix.out }}
          retention-days: 14
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD GATE — Sentinelle qui valide que les builds sont verts
  # ═══════════════════════════════════════════════════════════════════════

  build-gate:
    name: All builds passed
    # build-macos retiré (désactivé) — le rajouter ici en réactivant le job macOS.
    needs: [build-ios, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "✓ All platform builds succeeded — proceeding to store uploads"

  # ═══════════════════════════════════════════════════════════════════════
  # PUBLISHES — Uploads stores (déclenchés après build-gate uniquement)
  # ═══════════════════════════════════════════════════════════════════════

  # ────────────────────────────────────────────────────────────────────────
  # PUBLISH iOS — Upload de l'IPA sur TestFlight (groupe beta interne).
  # ────────────────────────────────────────────────────────────────────────
  publish-ios:
    name: Publish iOS to TestFlight
    needs: [prepare, build-gate]
    # macos-15 obligatoire : `app-store-connect publish` utilise `altool`
    # qui ne tourne que sur macOS (composant de Xcode).
    runs-on: macos-15
    timeout-minutes: 120

    env:
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_MAX_FIND_BUILD_WAIT: "90"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (requis par codemagic-cli-tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        run: pip install codemagic-cli-tools

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: songbook-ios
          path: artifacts/

      - name: Publish to TestFlight (external beta group)
        run: |
          WHATS_NEW=$(jq -r '.[] | select(.language=="fr-FR") | .text' release_notes.json)
          IPA_PATH=$(find artifacts -type f -name '*.ipa' | head -1)
          echo "Uploading: $IPA_PATH"
          app-store-connect publish \
            --path "$IPA_PATH" \
            --testflight \
            --beta-group "Songbook Beta" \
            --expire-build-submitted-for-review \
            --locale fr-FR \
            --whats-new "$WHATS_NEW" \
            --max-find-build-wait 90

  publish-android:
    name: Publish Android to Play Store
    needs: [prepare, build-gate]
    # ubuntu-latest : `google-play bundles publish` utilise l'API Google
    # directement (pas de dépendance macOS).
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (requis par codemagic-cli-tools)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools
        run: pip install codemagic-cli-tools

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: songbook-android
          path: artifacts/

      - name: Publish to Play Store (internal track)
        run: |
          AAB_PATH=$(find artifacts -type f -name '*.aab' | head -1)
          echo "Uploading: $AAB_PATH"
          google-play bundles publish \
            --credentials "@env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" \
            --bundle "$AAB_PATH" \
            --track internal \
            --release-notes "@file:release_notes_android.json"

  # ────────────────────────────────────────────────────────────────────────
  # PUBLISH macOS — DÉSACTIVÉ POUR LE MOMENT (décommenter avec build-macos).
  # ────────────────────────────────────────────────────────────────────────
  # publish-macos:
  #   name: Publish macOS to TestFlight
  #   needs: [prepare, build-gate]
  #   # 120 min de timeout : le processing Apple pour les .pkg macOS est souvent
  #   # plus lent que pour les .ipa.
  #   runs-on: macos-15
  #   timeout-minutes: 120
  #
  #   env:
  #     APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
  #     APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
  #     APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
  #     APP_STORE_CONNECT_MAX_FIND_BUILD_WAIT: "90"
  #
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - name: Setup Python (requis par codemagic-cli-tools)
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #
  #     - name: Install codemagic-cli-tools
  #       run: pip install codemagic-cli-tools
  #
  #     - name: Download macOS artifact
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: songbook-macos
  #         path: artifacts/
  #
  #     - name: Publish to TestFlight (internal beta group, macOS)
  #       run: |
  #         WHATS_NEW=$(jq -r '.[] | select(.language=="fr-FR") | .text' release_notes.json)
  #         PKG_PATH=$(find artifacts -type f -name '*.pkg' | head -1)
  #         echo "Uploading: $PKG_PATH"
  #         app-store-connect publish \
  #           --path "$PKG_PATH" \
  #           --testflight \
  #           --beta-group "Songbook Internal" \
  #           --expire-build-submitted-for-review \
  #           --locale fr-FR \
  #           --whats-new "$WHATS_NEW" \
  #           --max-find-build-wait 90

  # ═══════════════════════════════════════════════════════════════════════
  # GITHUB RELEASE — Tous les artifacts attachés, après publishes verts
  # ═══════════════════════════════════════════════════════════════════════

  release:
    name: Create GitHub Release
    # publish-macos retiré (désactivé) — le rajouter ici en réactivant macOS.
    # build-updater : attend les binaires updater pour les attacher à la release.
    needs: [prepare, publish-ios, publish-android, build-updater]
    # TEMPORAIRE : condition `if: startsWith(github.ref, 'refs/tags/v')`
    # désactivée pour pouvoir tester le job release via workflow_dispatch
    # sans avoir à tagger. À RESTAURER une fois la validation faite.
    # if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        run: |
          BODY=$(jq -r '.[] | select(.language=="fr-FR") | .text' release_notes.json)

          # On n'attache que les assets réellement présents : `mapping.txt`
          # n'existe que si R8/minify est activé (ce n'est pas le cas ici), et
          # certaines plateformes peuvent être désactivées. Passer un argument
          # vide à `gh release create` fait échouer la commande.
          ASSETS=()
          echo "Releasing assets:"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "  - $f"
            ASSETS+=("$f")
          done < <(find artifacts -type f \
            \( -name '*.ipa' -o -name '*.aab' -o -name '*.apk' \
               -o -name 'mapping.txt' -o -name '*.pkg' \
               -o -name '*.zip' -o -name '*.AppImage' \
               -o -name 'songbook-updater-windows.exe' \
               -o -name 'songbook-updater-linux' \) | sort)

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "ERROR: no release assets found"
            exit 1
          fi

          # Tag name : `v<version>` si on est sur un tag, sinon nom synthétique
          # avec run_number pour éviter toute collision avec un tag git existant
          # et pour ne pas créer une release tagged sur un nom de branche
          # (ce qui serait invalide / source de confusion).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="dispatch-v${VERSION}-${{ github.run_number }}"
          fi
          echo "Release tag: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" \
            --title "Songbook v$VERSION" \
            --notes "$BODY" \
            "${ASSETS[@]}"
